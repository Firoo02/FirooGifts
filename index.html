<script>
(function () {
  var html = document.documentElement, btn = document.getElementById('lang');
  function setLang(l) {
    html.lang = l; html.dir = l === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-en]').forEach(function (e) { e.textContent = e.getAttribute('data-' + l); });
    document.querySelectorAll('[data-html-en]').forEach(function (e) { e.innerHTML = e.getAttribute('data-html-' + l); });
    btn.textContent = l === 'ar' ? 'English' : 'العربية';
    try { localStorage.setItem('lang', l); } catch (e) {}
  }
  var saved = 'en';
  try { saved = localStorage.getItem('lang') || (/^ar/i.test(navigator.language) ? 'ar' : 'en'); } catch (e) {}
  setLang(saved);
  btn.onclick = function () { setLang(html.lang === 'ar' ? 'en' : 'ar'); };
})();
</script>
